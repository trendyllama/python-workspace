[project]
name = "python-workspace"
version = "0.0.0"
description = "personal python monorepo for various python projects"
requires-python = ">=3.13"
readme = "README.md"
dependencies = [
    "aiosqlite>=0.21.0",
    "fastapi[standard]>=0.120.2",
    "numpy>=2.2.6",
    "pandas>=2.3.0",
    "pyarrow>=20.0.0",
    "requests>=2.32.4",
    "scipy>=1.15.3",
    "sqlalchemy[asyncio]>=2.0.43",
    "pytest>=8.3.4",
    "ruff>=0.6.8",
    "ty>=0.0.49",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false
exclude = ["tutorial_app.client", "tutorial_app.client.*"]

[tool.setuptools.package-data]
tutorial_app = [
    "api/config/*.ini",
    "api/config/*.json",
    "dist/**/*",
]





[tool.ruff.format]

# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"

# Enable reformatting of code snippets in docstrings.
docstring-code-format = true

[tool.ruff.lint]

extend-select = [
    "A",  # All auto-fixes
    "B",  # Bug risk
    "C",  # Complexity
    "E",  # Error
    "F",  # Formatting
    "N",  # Naming convention
    "Q",  # Quality
    "W",  # Warning
    "SIM",
    "UP",
    "LOG",
    "G",
    "PD",
    "ERA",
    "C4",
    'EM',
    "INT",
    "ISC",
    "ICN",
    "PIE",
    "T20",
    "PYI",
    "PTH",
    "PERF",
   "UP",
   "FURB",
   "RUF",
   'PT',
   'T10',
   "TCH"


]

extend-ignore = [
    "E501",  # Line too long
]

[tool.pytest.ini_options]
addopts = "-s --doctest-modules"
asyncio_mode = "auto"
testpaths = ["tests"]
